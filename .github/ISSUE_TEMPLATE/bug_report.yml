name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities do **not** open an issue. Use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: dropdown
    id: deploy
    attributes:
      label: How are you running it?
      options: [Docker Compose, From source (pnpm), Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove hostnames, IPs and anything secret first.
      render: shell
