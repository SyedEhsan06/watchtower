services:
  watchtower-migrator:
    build:
      context: .
      dockerfile: infra/docker/migrator.Dockerfile
    container_name: watchtower-migrator
    profiles: ['migrate']
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: 'no'

  watchtower-api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: watchtower-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: https://watchtower.syedehsan.com
      API_URL: https://api.watchtower.syedehsan.com
      AUTH_SECRET: ${AUTH_SECRET}
      SSH_MASTER_ENCRYPTION_KEY: ${SSH_MASTER_ENCRYPTION_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      LOG_LEVEL: info
    networks:
      - default
      - proxy

  watchtower-web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.watchtower.syedehsan.com
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    container_name: watchtower-web
    restart: unless-stopped
    depends_on:
      - watchtower-api
    environment:
      NODE_ENV: production
      API_URL: http://watchtower-api:4000
      NEXT_PUBLIC_API_URL: https://api.watchtower.syedehsan.com
    networks:
      - default
      - proxy

networks:
  default:
    name: watchtower_default
  # Join Caddy's shared network so it can reach these containers by name.
  proxy:
    external: true
    name: sydinnovations-os-prod_default
