services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower
      POSTGRES_DB: watchtower
    ports:
      - "5435:5432"
    volumes:
      - watchtower-postgres-data:/var/lib/postgresql/data

volumes:
  watchtower-postgres-data:
